<header class="bar">
  <strong>Support desk</strong>

  @if (room(); as current) {
    <span>Open this link in another tab to join as the customer:</span>
    <a [href]="current.speakerUrl" target="_blank">customer link</a>
    <button (click)="endMeeting()">End meeting for everyone</button>
  } @else {
    <button class="primary" (click)="createRoom()">Start call</button>
  }
</header>

<!-- The whole meeting UI is this one element, bound to the room the backend created. -->
@if (room(); as current) {
  <openvidu-meet
    #meet
    class="stage"
    [attr.room-url]="current.moderatorUrl"
    participant-name="Support agent"
    (joined)="onJoined($event)"
    (closed)="onClosed()"
  ></openvidu-meet>
}
